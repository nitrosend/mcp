name: Release

# Pushing a vX.Y.Z tag publishes that version to npm. The package trusts this
# workflow through npm trusted publishing, so no npm token is stored here.

on:
  workflow_dispatch:
    inputs:
      publisher_check:
        description: Validate trusted publisher authentication without publishing
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install and build
        run: npm ci

      - name: Test
        run: npm run test:bridge

      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="${GITHUB_REF_NAME#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          npm publish --access public

  publisher_check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_check }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm install --global npm@12.2.1
      - name: Validate repository authentication without publishing
        run: |
          log="$RUNNER_TEMP/npm-publisher-check.log"
          trap 'rm -f "$log"' EXIT
          npm dist-tag ls @nitrosend/mcp --loglevel=verbose > "$log" 2>&1
          if ! grep -Fq 'verbose oidc Successfully retrieved and set token' "$log"; then
            echo 'Trusted publisher authentication was not validated.' >&2
            exit 1
          fi
          echo 'Repository trusted publisher authentication validated; no package or tag was changed.'
